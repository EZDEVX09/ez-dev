name: Test & deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run end-to-end tests
        run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      EZ_DOMAIN: ${{ vars.EZ_DOMAIN }}
      CF_WORKERS_SUBDOMAIN: ${{ vars.CF_WORKERS_SUBDOMAIN }}
      EZ_EMAIL_FROM: ${{ vars.EZ_EMAIL_FROM }}
      STRIPE_PORTAL_CONFIG: ${{ vars.STRIPE_PORTAL_CONFIG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare secrets
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Missing Actions secret CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions → Secrets tab → Repository secrets)."; missing=1; else echo "CLOUDFLARE_API_TOKEN: found (${#CLOUDFLARE_API_TOKEN} characters)"; fi
          if [ "$missing" = 1 ]; then exit 1; fi
          # Verify the token, and find the account ID from it when it isn't set.
          verify=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "$verify" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Token status:', d.get('result',{}).get('status') or d.get('errors'))"
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            accounts=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")
            id=$(echo "$accounts" | python3 -c "
          import sys,json
          d=json.load(sys.stdin); r=d.get('result') or []
          print(r[0]['id'] if len(r)==1 else '')
          print(f'Accounts visible to token: {len(r)}', file=sys.stderr)")
            if [ -z "$id" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID is missing and couldn't be found from the token. Add it as an Actions secret."; exit 1; fi
            echo "::add-mask::$id"
            echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_ACCOUNT_ID: found from the API token"
          else
            echo "CLOUDFLARE_ACCOUNT_ID: found (${#CLOUDFLARE_ACCOUNT_ID} characters)"
          fi

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Generate Worker configs (finds or creates the D1 database)
        id: config
        run: node scripts/configure.mjs

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply ez-dev-db --remote -c apps/ezdev/wrangler.json

      - name: Deploy EZ DEV, EZ APP, EZ SITE, EZ DEFENDER
        run: |
          for app in ezdev ezapp ezsite ezdefender; do
            echo "::group::Deploy $app"
            npx wrangler deploy -c apps/$app/wrangler.json
            echo "::endgroup::"
          done

      - name: Upload secrets (Claude, Stripe, Resend)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/push-secrets.mjs

      - name: Smoke test
        run: |
          sleep 5
          for url in ${{ steps.config.outputs.urls }}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url/healthz")
            if [ "$code" = "200" ]; then
              echo "::notice::Live: $url"
            else
              echo "::warning::$url/healthz answered $code (new custom domains can take a few minutes)"
            fi
          done
